services:
  # Nginx reverse proxy - single entry point
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:8097:80"
      # Uncomment for SSL:
      # - "8443:443"
    volumes:
      - python-generated:/var/www/generated/python:ro
      - java-generated:/var/www/generated/java:ro
      - r-generated:/var/www/generated/r:ro
      - pygame-generated:/var/www/generated/pygame:ro
      # Uncomment for SSL certificates:
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on: []  # Will be populated by profiles

  # Python 3 - Manager 8100, Shell 8110
  python3-shell:
    build: ./python/shell
    profiles: ["python3"]
    # Internal only - no external port
    expose:
      - "8010"
    volumes:
      - python-sessions:/tmp/sessions
    # Production security options (uncomment for hardened deployment):
    mem_limit: 500m
    mem_reservation: 375m
    cpus: 1.0
    cpu_shares: 512
    pids_limit: 50
    # read_only: true
    # tmpfs:
    #   - /tmp:size=100m

  python3-manager:
    build: ./python/manager
    profiles: ["python3"]
    # Internal only - nginx proxies to this
    expose:
      - "8100"
    volumes:
      - python-generated:/tmp/python-generated
    depends_on:
      - python3-shell
    environment:
      - NODE_ENV=production

  # Java - Manager 8200, Shell 8210
  java-shell:
    build: ./java/shell
    profiles: ["java"]
    expose:
      - "8010"
    volumes:
      - java-sessions:/tmp/sessions
    # Resource limits. NOTE that ONE shell container serves EVERY concurrent
    # session, so each of these is a ceiling for the whole class, not per user.
    # Sized from measurements on a 40-student class; adjust to your host and
    # class size, but understand what each one does before lowering it.
    #
    # pids_limit counts THREADS, not processes: ~23 threads at idle plus ~15 per
    # concurrent program (a session's node + chokidar watcher, javac, then the
    # JVM), so 40 concurrent needs ~620. 800 leaves ~30% headroom. Keep a limit
    # -- it is the fork-bomb guard against hostile code -- but do not set it
    # near the old 50: that refuses fork() at the THIRD concurrent program, and
    # the failure surfaces as "Some unknown compiler error occurred" with empty
    # stderr, because javac never ran.
    pids_limit: 800
    # The image ends in `pm2-runtime`, which does not wait() on arbitrary
    # children. server.js reaps its own, but when server.js itself dies mid-run
    # its in-flight javac/java re-parent to PID 1 and become permanent zombies,
    # each holding a pid slot -- so the effective pids ceiling decays with
    # uptime and a plain restart only resets the clock. tini reaps them.
    init: true
    # ~18 MiB per concurrent program over a ~30 MiB idle floor, so 40 concurrent
    # is ~750 MiB. This limit is decoupled from per-program appetite because
    # server.js passes an explicit -Xmx (TRINKET_JAVA_FLAGS, default -Xmx256m);
    # without that the JVM would derive its max heap from 1/4 of this number and
    # raising the limit would silently raise every student's appetite.
    mem_limit: 1.5g
    mem_reservation: 512m
    # javac is CPU-bound. At cpus: 1.0 the entire class shares a single core and
    # 40 concurrent compiles each take ~40x longer, which reads as a hang.
    # Give it several cores if the host has them.
    cpus: 4.0
    cpu_shares: 512

  java-manager:
    build: ./java/manager
    profiles: ["java"]
    expose:
      - "8200"
    volumes:
      - java-generated:/tmp/java-generated
    depends_on:
      - java-shell
    environment:
      - NODE_ENV=production

  # R - Manager 8300, Shell 8310
  r-shell:
    build: ./r/shell
    profiles: ["r"]
    expose:
      - "8010"
    volumes:
      - r-sessions:/tmp/sessions
    # Production security options (uncomment for hardened deployment):
    # mem_limit: 500m
    # mem_reservation: 375m
    # cpus: 1.0
    # cpu_shares: 512
    # pids_limit: 50

  r-manager:
    build: ./r/manager
    profiles: ["r"]
    expose:
      - "8300"
    volumes:
      - r-generated:/tmp/r-generated
    depends_on:
      - r-shell
    environment:
      - NODE_ENV=production

  # Pygame - Manager 8400, Worker 8010 + VNC 6080
  pygame-worker:
    build: ./pygame/worker
    profiles: ["pygame"]
    expose:
      - "8010"   # Shell socket.io
      - "6080"   # noVNC WebSocket
    volumes:
      - pygame-sessions:/tmp/pygame
    # Production security options (uncomment for hardened deployment):
    # mem_limit: 1g
    # mem_reservation: 750m
    # cpus: 2.0

  pygame-manager:
    build: ./pygame/manager
    profiles: ["pygame"]
    expose:
      - "8100"
    volumes:
      - pygame-generated:/tmp/pygame-generated
    depends_on:
      - pygame-worker
    environment:
      - NODE_ENV=production

volumes:
  python-sessions:
  python-generated:
  java-sessions:
  java-generated:
  r-sessions:
  r-generated:
  pygame-sessions:
  pygame-generated:
